<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Grid System & Utilities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h1 class="text-center text-primary fw-bold mb-4">Bootstrap 5 Grid Layout</h1>
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-4 bg-white border rounded shadow-sm text-center">
                    <h4>Column 1</h4>
                    <p class="text-muted mb-0">Full width on mobile, 2 cols on tablet, 3 cols on desktop.</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-4 bg-white border rounded shadow-sm text-center">
                    <h4>Column 2</h4>
                    <p class="text-muted mb-0">Styled using Bootstrap spacing (p-4, my-5) and border utilities.</p>
                </div>
            </div>
            <div class="col-12 col-md-12 col-lg-4">
                <div class="p-4 bg-white border rounded shadow-sm text-center">
                    <h4>Column 3</h4>
                    <p class="text-muted mb-0">Responsive 12-column flexbox grid system.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
