<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive News Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Georgia, serif; font-size: 1rem; line-height: 1.6; }
        header {
            background: #0f172a; color: #fff;
            min-height: 18vh;
            display: flex; align-items: center; justify-content: center;
            padding: 2vw; text-align: center;
        }
        header h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); }
        .news-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            padding: 4vw;
        }
        article { border: 1px solid #cbd5e1; padding: 1.2rem; border-radius: 6px; }

        /* Tablet Breakpoint */
        @media (min-width: 600px) {
            .news-grid { grid-template-columns: repeat(2, 1fr); }
        }
        /* Desktop Breakpoint */
        @media (min-width: 992px) {
            .news-grid { grid-template-columns: repeat(3, 1fr); max-width: 1200px; margin: auto; }
        }
    </style>
</head>
<body>
    <header>
        <h1>The Daily Campus Chronicle</h1>
    </header>
    <main class="news-grid">
        <article><h2>Tech Symposium 2026</h2><p>Over 500 students participated in the annual coding marathon.</p></article>
        <article><h2>Library Digital Expansion</h2><p>New IEEE and ACM digital archives are now accessible on campus Wi-Fi.</p></article>
        <article><h2>Sports Meet Results</h2><p>CSE Department wins the inter-departmental athletics trophy.</p></article>
    </main>
</body>
</html>
