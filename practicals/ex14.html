<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Catalogue - CSS Flexbox</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f8fafc; }
        h1 { text-align: center; }
        .flex-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .menu-item {
            flex: 1 1 260px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .price { font-weight: bold; color: #ea580c; }
    </style>
</head>
<body>
    <h1>Campus Café Menu</h1>
    <div class="flex-container">
        <div class="menu-item">
            <h3>Paneer Tikka Wrap</h3>
            <p>Grilled cottage cheese with mint chutney in a whole-wheat wrap.</p>
            <span class="price">₹120</span>
        </div>
        <div class="menu-item">
            <h3>Cold Coffee</h3>
            <p>Chilled blended espresso with creamy milk and chocolate drizzle.</p>
            <span class="price">₹90</span>
        </div>
        <div class="menu-item">
            <h3>Veg Club Sandwich</h3>
            <p>Triple-layered toasted sandwich loaded with fresh veggies and cheese.</p>
            <span class="price">₹110</span>
        </div>
    </div>
</body>
</html>
