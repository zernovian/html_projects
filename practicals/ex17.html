<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Transforms, Transitions & Keyframes</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f8fafc; }
        @keyframes pulseBadge {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .animated-banner {
            display: inline-block;
            background: #2563eb; color: #fff;
            padding: 12px 24px; border-radius: 25px;
            animation: pulseBadge 2s infinite ease-in-out;
            margin-bottom: 30px;
        }
        .hover-card {
            width: 280px; margin: 0 auto; padding: 20px;
            background: #fff; border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 20px rgba(0,0,0,0.18);
        }
        .btn-trans {
            margin-top: 15px; padding: 10px 18px;
            background: #0f172a; color: #fff; border: none; border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .btn-trans:hover { background-color: #16a34a; transform: rotate(-2deg); }
    </style>
</head>
<body>
    <div class="animated-banner">Keyframe Animated Notification</div>
    <div class="hover-card">
        <h3>Interactive Card</h3>
        <p>Hover over this card to see smooth CSS translate and scale transforms.</p>
        <button class="btn-trans">Hover Button</button>
    </div>
</body>
</html>
