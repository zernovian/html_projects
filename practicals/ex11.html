<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Styling Methods</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="ex11.css">
    <!-- Internal CSS -->
    <style>
        .internal-box {
            background-color: #e0f2fe;
            border-left: 5px solid #0284c7;
            padding: 1rem;
            margin: 15px 0;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <!-- Inline CSS -->
    <h1 style="color: #b91c1c; text-align: center; text-transform: uppercase;">
        CSS Styling Demonstration
    </h1>

    <div class="internal-box">
        This section is styled using <strong>Internal CSS</strong> with rem units and background colors.
    </div>

    <p class="external-text">
        This paragraph is styled using <strong>External CSS</strong> demonstrating typography, line-height, and letter-spacing.
    </p>
</body>
</html>
