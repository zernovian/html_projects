<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimized College Event Webpage</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:system-ui,sans-serif;line-height:1.5;padding:16px}
        img{max-width:100%;height:auto;display:block;border-radius:8px}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}
    </style>
</head>
<body>
    <h1>TechFest 2026 - Performance Optimized</h1>
    <div class="grid">
        <img src="event1.jpg" alt="Hackathon Arena" width="600" height="400" loading="lazy">
        <img src="event2.jpg" alt="Robotics Showcase" width="600" height="400" loading="lazy">
    </div>
</body>
</html>
