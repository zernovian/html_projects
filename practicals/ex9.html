<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - UI/UX Design</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
        nav { background: #1e293b; padding: 14px 24px; display: flex; gap: 20px; }
        nav a { color: #fff; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: 24px auto; padding: 20px; background: #fff; border-radius: 8px; }
        .alert { background: #dcfce7; color: #166534; padding: 12px; border-left: 4px solid #16a34a; margin-bottom: 16px; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #1d4ed8; }
        input, textarea { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    </style>
</head>
<body>
    <nav>
        <a href="#dashboard">Dashboard</a>
        <a href="#courses">My Courses</a>
        <a href="#support">Helpdesk</a>
    </nav>
    <div class="container">
        <div class="alert"><strong>Notice:</strong> Semester 1 Practical File submission is open.</div>
        <section id="dashboard">
            <h2>Welcome, Saksham</h2>
            <p>Quickly access your attendance, assignments, and faculty feedback from one consistent interface.</p>
        </section>
        <section id="support">
            <h3>Submit Query / Feedback</h3>
            <form onsubmit="event.preventDefault(); document.getElementById('msg').style.display='block';">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" required placeholder="Enter query subject">
                <label for="details">Message:</label>
                <textarea id="details" rows="3" required placeholder="Describe your issue"></textarea>
                <button type="submit" class="btn">Submit Ticket</button>
            </form>
            <p id="msg" class="alert" style="display:none; margin-top:12px;">Your ticket has been submitted successfully!</p>
        </section>
    </div>
</body>
</html>
