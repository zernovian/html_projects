<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Portal</title>
</head>
<body>
    <h1>Online Student Registration Portal</h1>
    <form action="#" method="POST">
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"><br><br>

        <label for="pwd">Create Password:</label><br>
        <input type="password" id="pwd" name="password" placeholder="Enter password"><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label><br><br>

        <label>Skills / Interests:</label><br>
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML5</label>
        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS3</label>
        <input type="checkbox" id="cprog" name="skills" value="C">
        <label for="cprog">C Programming</label><br><br>

        <label for="branch">Select Branch:</label><br>
        <select id="branch" name="branch">
            <option value="cse">B.E. Computer Science &amp; Engineering</option>
            <option value="ai">B.E. CSE (Artificial Intelligence)</option>
            <option value="ece">B.E. Electronics &amp; Communication</option>
        </select><br><br>

        <label for="address">Residential Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter complete address"></textarea><br><br>

        <button type="submit">Register</button>
        <button type="reset">Reset Form</button>
    </form>
</body>
</html>
