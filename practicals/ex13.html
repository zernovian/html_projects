<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Box Model & Card Layout</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f1f5f9; padding: 30px; }
        .card {
            width: 320px;
            height: auto;
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .card h3 { margin-top: 0; color: #0f172a; }
        .price { font-size: 20px; font-weight: bold; color: #16a34a; margin: 12px 0; }
        .card button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>Web Development Bootcamp</h3>
        <p>Complete hands-on training in HTML5, CSS3, Bootstrap, and GitHub deployment.</p>
        <div class="price">₹1,499</div>
        <button>Enroll Now</button>
    </div>
</body>
</html>
